<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>StudyBuddy Onboarding - Step 4</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&family=Caveat:wght@400..700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Literata:wght@100..900&family=Source+Sans+3:wght@100..900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed-dim": "#bccbb1",
                        "inverse-primary": "#7d562d",
                        "on-tertiary": "#18343f",
                        "on-primary-fixed-variant": "#623f18",
                        "on-secondary": "#273422",
                        "secondary-container": "#3d4b37",
                        "on-tertiary-container": "#294450",
                        "tertiary-fixed": "#cae7f6",
                        "on-background": "#eae1db",
                        "surface-container-low": "#1f1b17",
                        "on-secondary-fixed": "#121f0e",
                        "on-tertiary-fixed": "#001f2a",
                        "primary-fixed-dim": "#f0bd8b",
                        "tertiary": "#b0ccdb",
                        "on-secondary-container": "#aabaa0",
                        "on-surface": "#eae1db",
                        "on-secondary-fixed-variant": "#3d4b37",
                        "surface-container-lowest": "#110d0a",
                        "tertiary-container": "#95b1bf",
                        "primary-fixed": "#ffdcbd",
                        "surface-container": "#231f1b",
                        "surface": "#17130f",
                        "inverse-on-surface": "#342f2c",
                        "surface-container-highest": "#393430",
                        "on-primary-fixed": "#2c1600",
                        "outline": "#9c8e82",
                        "surface-tint": "#f0bd8b",
                        "on-primary-container": "#5b3912",
                        "secondary": "#bccbb1",
                        "on-error": "#690005",
                        "outline-variant": "#50453b",
                        "tertiary-fixed-dim": "#aecbda",
                        "primary-container": "#d4a373",
                        "surface-dim": "#17130f",
                        "on-error-container": "#ffdad6",
                        "on-primary": "#482904",
                        "error": "#ffb4ab",
                        "secondary-fixed": "#d8e7cc",
                        "surface-bright": "#3d3834",
                        "inverse-surface": "#eae1db",
                        "error-container": "#93000a",
                        "on-surface-variant": "#d4c4b7",
                        "surface-container-high": "#2e2925",
                        "on-tertiary-fixed-variant": "#2f4a57",
                        "surface-variant": "#393430",
                        "primary": "#f2be8c",
                        "background": "#17130f"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "base": "8px",
                        "notebook-line-height": "32px",
                        "gutter": "16px",
                        "container-padding": "24px"
                    },
                    "fontFamily": {
                        "label-caps": ["\"Source Sans 3\""],
                        "body-lg": ["\"Source Sans 3\""],
                        "headline-md": ["Literata"],
                        "display-lg": ["Literata"],
                        "note-sm": ["Caveat"],
                        "display-lg-mobile": ["Literata"],
                        "body-md": ["\"Source Sans 3\""]
                    },
                    "fontSize": {
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "note-sm": ["20px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "display-lg-mobile": ["34px", {"lineHeight": "40px", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
        body {
            background-color: #17130f;
            color: #eae1db;
            overflow-x: hidden;
        }

        .notebook-texture {
            background-image: repeating-linear-gradient(
                transparent,
                transparent 31px,
                rgba(242, 190, 140, 0.05) 31px,
                rgba(242, 190, 140, 0.05) 32px
            );
            background-size: 100% 32px;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }

        .card-active {
            box-shadow: 0 4px 8px rgba(0,0,0,0.3), 0 24px 40px rgba(0,0,0,0.15);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-md text-body-md min-h-screen flex flex-col notebook-texture">
<!-- Progress Header -->
<header class="w-full pt-8 px-container-padding space-y-6">
<div class="flex gap-2 w-full max-w-xl mx-auto h-1.5">
<div class="flex-1 bg-primary rounded-full"></div>
<div class="flex-1 bg-primary rounded-full"></div>
<div class="flex-1 bg-primary rounded-full"></div>
<div class="flex-1 bg-primary rounded-full"></div>
<div class="flex-1 bg-surface-container-high rounded-full"></div>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-container-padding py-12 max-w-xl mx-auto w-full">
<!-- Typography Header -->
<div class="text-center mb-10">
<h1 class="font-headline-md text-headline-md text-on-surface mb-2">How often should we plan?</h1>
<p class="font-body-md text-body-md text-on-surface-variant opacity-80">You can regenerate this anytime from your Home screen.</p>
</div>
<!-- Selection Cards -->
<div class="w-full space-y-4">
<!-- Daily Card -->
<button class="w-full text-left p-5 bg-surface-container-low border border-outline-variant rounded-xl flex items-center gap-4 transition-all duration-200 hover:bg-surface-container active:scale-[0.98]" onclick="selectCard(this)">
<div class="w-12 h-12 flex items-center justify-center rounded-lg bg-surface-container">
<span class="material-symbols-outlined text-on-surface-variant">schedule</span>
</div>
<div class="flex-1">
<h3 class="font-headline-md text-body-lg text-on-surface">Daily</h3>
<p class="font-body-md text-label-caps text-on-surface-variant">A fresh plan for just today</p>
</div>
<div class="check-container w-6 h-6 border border-outline-variant rounded-full flex items-center justify-center opacity-0 transition-opacity">
<span class="material-symbols-outlined text-primary text-[18px]" style="font-variation-settings: 'wght' 700;">check</span>
</div>
</button>
<!-- Weekly Card (PRE-SELECTED) -->
<button class="w-full text-left p-5 bg-surface-container-low border-2 border-primary rounded-xl flex items-center gap-4 card-active relative overflow-hidden transition-all duration-200 active:scale-[0.98]" onclick="selectCard(this)">
<div class="absolute top-0 right-0 p-2">
<span class="font-label-caps text-label-caps text-primary bg-primary/10 px-2 py-0.5 rounded">RECOMMENDED</span>
</div>
<div class="w-12 h-12 flex items-center justify-center rounded-lg bg-primary-container/20">
<span class="material-symbols-outlined text-primary">event_repeat</span>
</div>
<div class="flex-1">
<h3 class="font-headline-md text-body-lg text-on-surface">Weekly</h3>
<p class="font-body-md text-label-caps text-on-surface-variant">A full week mapped out, the recommended default</p>
</div>
<div class="check-container w-6 h-6 bg-primary rounded-full flex items-center justify-center opacity-100 transition-opacity">
<span class="material-symbols-outlined text-primary-container text-[18px]" style="font-variation-settings: 'wght' 700;">check</span>
</div>
</button>
<!-- Monthly Card -->
<button class="w-full text-left p-5 bg-surface-container-low border border-outline-variant rounded-xl flex items-center gap-4 transition-all duration-200 hover:bg-surface-container active:scale-[0.98]" onclick="selectCard(this)">
<div class="w-12 h-12 flex items-center justify-center rounded-lg bg-surface-container">
<span class="material-symbols-outlined text-on-surface-variant">calendar_month</span>
</div>
<div class="flex-1">
<h3 class="font-headline-md text-body-lg text-on-surface">Monthly</h3>
<p class="font-body-md text-label-caps text-on-surface-variant">A broader view, focus areas instead of hours</p>
</div>
<div class="check-container w-6 h-6 border border-outline-variant rounded-full flex items-center justify-center opacity-0 transition-opacity">
<span class="material-symbols-outlined text-primary text-[18px]" style="font-variation-settings: 'wght' 700;">check</span>
</div>
</button>
</div>
<!-- Post-it Note Micro-interaction -->
<div class="mt-12 self-start transform -rotate-2 p-4 bg-surface-container shadow-lg border-t-4 border-primary max-w-[240px]">
<p class="font-note-sm text-note-sm text-on-surface opacity-90">
                "Weekly planning is statistically shown to reduce decision fatigue by 40%."
            </p>
</div>
</main>
<!-- Navigation Footer -->
<footer class="w-full p-container-padding max-w-xl mx-auto flex gap-4">
<button class="w-[40%] h-14 rounded-xl border border-tertiary text-tertiary font-label-caps text-label-caps hover:bg-tertiary/10 transition-colors flex items-center justify-center gap-2 group">
<span class="material-symbols-outlined group-hover:-translate-x-1 transition-transform">arrow_back</span>
            Back
        </button>
<button class="w-[60%] h-14 rounded-xl bg-primary text-on-primary font-label-caps text-label-caps hover:bg-primary-container transition-all flex items-center justify-center gap-2 shadow-lg active:scale-95">
            Next
            <span class="material-symbols-outlined" style="font-variation-settings: 'wght' 700;">arrow_forward</span>
</button>
</footer>
<script>
        function selectCard(element) {
            // Reset all cards
            document.querySelectorAll('button[onclick="selectCard(this)"]').forEach(btn => {
                btn.classList.remove('border-2', 'border-primary', 'card-active');
                btn.classList.add('border', 'border-outline-variant');
                
                // Reset checkmarks
                const check = btn.querySelector('.check-container');
                check.classList.remove('bg-primary', 'opacity-100');
                check.classList.add('border', 'border-outline-variant', 'opacity-0');
                
                const icon = check.querySelector('.material-symbols-outlined');
                icon.classList.remove('text-primary-container');
                icon.classList.add('text-primary');

                // Toggle icon background
                const iconBox = btn.querySelector('div:first-child');
                iconBox.classList.remove('bg-primary-container/20');
                iconBox.classList.add('bg-surface-container');
            });

            // Set active card
            element.classList.add('border-2', 'border-primary', 'card-active');
            element.classList.remove('border', 'border-outline-variant');
            
            const check = element.querySelector('.check-container');
            check.classList.add('bg-primary', 'opacity-100');
            check.classList.remove('border', 'border-outline-variant', 'opacity-0');

            const icon = check.querySelector('.material-symbols-outlined');
            icon.classList.add('text-primary-container');
            icon.classList.remove('text-primary');

            const iconBox = element.querySelector('div:first-child');
            iconBox.classList.add('bg-primary-container/20');
            iconBox.classList.remove('bg-surface-container');
        }
    </script>
</body></html>
