<body class="bg-background text-on-background font-body-md text-body-md min-h-screen flex flex-col notebook-bg">
<!-- TopAppBar -->
<header class="fixed top-0 w-full bg-background z-50 flex justify-between items-center px-container-padding h-16">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full overflow-hidden bg-surface-container-high border border-outline-variant/20">
<img class="w-full h-full object-cover" data-alt="A focused student portrait with warm, studious lighting, wearing modern spectacles, set against a blurred background of a dark wooden library shelf. The aesthetic is clean, academic, and professional, using a deep charcoal and muted ochre color palette to match the high-end planner interface style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuApFTPvMN8R2HoD4Erppyejodhy3Tcje_61T8QPDvTLtBY4jKAIOHqalLmUmqFotxhOZo3HlzWr7NMtpKgugCzRZQaze4h3NfsEjtdtjHc4sXBN6eMvlJZmKBxfMRryCEVqBDpt96PSUz4aID2QyZ9mec6x9PFuaQwUb-yZhwytO6OQuAca8822MfYpWaZslYp8Fi5Xu4-vvL109X4w-LhtfiqWAFXpwRtvWHXrgcmEEBOBHqDXFzpu">
</div>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">Good Morning, Scholar</h1>
</div>
<button class="text-primary hover:bg-surface-container-low transition-colors p-2 rounded-lg active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="calendar_today">calendar_today</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-container-padding pt-16 pb-24">
<!-- Error State Card -->
<div class="max-w-md w-full bg-surface-container p-8 rounded-lg contact-shadow text-center border-t-2 border-custom-error/30 relative overflow-hidden">
<!-- Subtle Decorative Post-it for aesthetic flavor -->
<div class="hidden md:block absolute -top-4 -right-4 w-24 h-24 bg-surface-container-high border-t-4 border-primary-container rotate-6 flex items-center justify-center p-2 opacity-40">
<p class="font-note-sm text-note-sm text-primary-container">Sync error</p>
</div>
<!-- Error Icon -->
<div class="mb-6 flex justify-center">
<div class="p-4 rounded-full bg-custom-error/10">
<span class="material-symbols-outlined text-4xl text-custom-error" data-icon="error_outline">error_outline</span>
</div>
</div>
<!-- Content -->
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Couldn't build your plan</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-8">
                Check your connection and try again. Your academic schedule is safe; we just need a moment to reconnect to the library.
            </p>
<!-- Retry Button -->
<button class="w-full bg-primary-container text-on-primary-container font-label-caps text-label-caps py-4 rounded-[4px] hover:brightness-110 active:scale-95 transition-all duration-150 uppercase tracking-widest">
                Retry Connection
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-3 pb-safe bg-surface-container border-t border-outline-variant/10 shadow-lg md:rounded-t-full">
<!-- Home (Active) -->
<a class="flex flex-col items-center justify-center transition-all active:scale-90 duration-200 text-primary" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-caps text-label-caps mt-0.5">Home</span>
</a>
<!-- Tutor -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="school">school</span>
<span class="font-label-caps text-label-caps mt-0.5">Tutor</span>
</a>
<!-- Resources -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-all active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="menu_book">menu_book</span>
<span class="font-label-caps text-label-caps mt-0.5">Resources</span>
</a>
</nav>
<!-- Micro-interaction Script -->
<script>
        document.querySelector('button').addEventListener('click', function() {
            const btn = this;
            const originalText = btn.innerText;
            btn.innerText = "Attempting...";
            btn.classList.add('opacity-70');
            
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.remove('opacity-70');
                // Simulate a slight pulse on the icon
                const icon = document.querySelector('[data-icon="error_outline"]');
                icon.classList.add('animate-ping');
                setTimeout(() => icon.classList.remove('animate-ping'), 500);
            }, 1200);
        });
    </script>
