<div class="flex-1 bg-surface-container-high rounded-full"></div>
</div>
</header>

<p class="font-body-md text-on-surface-variant italic opacity-80">Optional — add as many as you need.</p>

<option>Mathematics</option>
<option>Chemistry</option>
<option>Biology</option>
</select>
</div>
<div class="grid grid-cols-2 gap-4">

<script>
        // Simple micro-interaction for the add button
        document.querySelector('button:contains("+ Add tuition")')?.addEventListener('click', () => {
            console.log('Adding new tuition row interaction...');
            // In a real app, this would append a new card to the list
        });
        
        // Custom selector polyfill for :contains as it doesn't exist in standard CSS
        const addBtn = Array.from(document.querySelectorAll('button')).find(el => el.textContent.includes('+ Add tuition'));
        if (addBtn) {
            addBtn.addEventListener('click', () => {
                alert('Add tuition flow initiated.');
            });
        }
