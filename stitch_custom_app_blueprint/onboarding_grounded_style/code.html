<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        display: inline-block;
        line-height: 1;
        text-transform: none;
        letter-spacing: normal;
        word-wrap: normal;
        white-space: nowrap;
        direction: ltr;
      }

      /* Ruled Notebook Texture */
      .notebook-rules {
        background-image: linear-gradient(to bottom, rgba(212, 163, 115, 0.05) 1px, transparent 1px);
        background-size: 100% 32px;
      }

      /* Stacked Paper Shadow System */
      .card-elevation {
        box-shadow: 
          0 24px 40px rgba(0, 0, 0, 0.15),
          0 4px 8px rgba(0, 0, 0, 0.3);
      }

      .subject-card {
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .subject-card.selected {
        border-color: #f2be8c; /* Primary Ochre */
        background-color: #231f1b; /* Surface Container */
      }
      
      .subject-card.selected .check-mark {
        opacity: 1;
        transform: scale(1);
      }

      .check-mark {
        opacity: 0;
        transform: scale(0.5);
        transition: all 0.2s ease-in-out;
      }

      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-gutter md:p-container-padding notebook-rules">
<!-- Top AppBar (Simulated Context) -->

<div class="font-display-lg-mobile text-display-lg-mobile text-primary">StudyBuddy</div>
<div class="w-10 h-10 rounded-full bg-surface-container-highest border border-outline-variant flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-on-surface-variant">person</span>
</div>
</header>
<main class="w-full max-w-4xl mt-20 mb-20 z-10">
<!-- Step Indicator -->
<div class="flex gap-2 mb-12 justify-center">
<div class="h-1.5 w-16 bg-primary-container rounded-full"></div>
<div class="h-1.5 w-16 bg-primary rounded-full"></div>
<div class="h-1.5 w-16 bg-surface-container-highest rounded-full"></div>
<div class="h-1.5 w-16 bg-surface-container-highest rounded-full"></div>
</div>
<!-- Header -->

<span class="material-symbols-outlined text-sm">check</span>
</div>
</button>
<!-- Subject Card 2 (Selected Example) -->
<button class="subject-card selected relative flex flex-col items-center justify-center p-8 bg-surface-container border-2 border-primary rounded-xl card-elevation group" onclick="toggleSelection(this)">

</button>

<!-- Post-it Note (Contextual Hint) -->

<!-- Background Decorative Shader -->
<div class="fixed inset-0 -z-10 opacity-20 pointer-events-none">

</div>
<script>
        function toggleSelection(el) {
            el.classList.toggle('selected');
            el.classList.toggle('border-transparent');
            el.classList.toggle('border-primary');
            el.classList.toggle('bg-surface-container-low');
            el.classList.toggle('bg-surface-container');
            
            const check = el.querySelector('.check-mark');
            if (el.classList.contains('selected')) {
                check.style.opacity = '1';
                check.style.transform = 'scale(1)';
            } else {
                check.style.opacity = '0';
                check.style.transform = 'scale(0.5)';
            }

            // Haptic-like microinteraction
            el.style.transform = 'scale(0.95)';
            setTimeout(() => {
                el.style.transform = 'scale(1)';
            }, 100);
        }
    </script>
