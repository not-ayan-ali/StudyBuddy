<style>
        @keyframes ring-pulse {
            0%, 100% { transform: scale(1); opacity: 0.3; stroke-width: 1.5px; }

        }

            animation: ring-pulse 2s ease-in-out infinite;
            transform-origin: center;
        }

            background-image: linear-gradient(to bottom, rgba(242, 190, 140, 0.05) 1px, transparent 1px);

<body class="font-body-md text-body-md selection:bg-primary-container selection:text-on-primary-container">

<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-variant overflow-hidden border border-outline-variant/20">
<img class="w-full h-full object-cover" data-alt="A dignified, close-up portrait of a serious university student in a dimly lit library. The lighting is low-key, with warm amber highlights hitting the side of their face, creating a scholarly and focused atmosphere. The background shows blurred book-filled shelves in deep charcoal and ink blue tones. The overall aesthetic is minimal, intellectual, and high-quality." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAZu1VVfAsnS0lJUhow2MavvxWDU6WsWqcXOHyWN7oE0s3BSBUw-U7OZPoVS5tKe4E0qVVUyOkUmvcE0HpKBSQcyY_a8ofMOrtnicQJSlQ5JzQxQGDU0NhE-31JUqe3DCn9gE_IIpT-4OH0wk4AI2i256YXIeS09x82-KQaCd4IZ2akeZ8Pz8UqEcZttQPCj98jA7iF9lGXjbTy8Xj2Ucouwgazg2fS77RCQPAnycrLK4oqXt1zp5C3">

<h1 class="font-headline-md text-headline-md text-primary dark:text-primary-fixed-dim">Good Morning, Scholar</h1>
</div>
<div class="flex items-center">
<button class="p-2 rounded-full hover:bg-surface-container-low transition-colors active:scale-95 duration-150 text-on-surface-variant">
<span class="material-symbols-outlined">calendar_today</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="relative flex flex-col items-center justify-center min-h-screen w-full notebook-lines px-6">
<!-- Center Loading Component -->
<div class="flex flex-col items-center text-center space-y-8">
<!-- Pulse Ring - Line Art -->
<div class="relative flex items-center justify-center w-32 h-32">
<svg class="w-full h-full animate-ring fill-none" viewBox="0 0 100 100">
<circle cx="50" cy="50" r="45" stroke="#f2be8c" stroke-linecap="round"></circle>
</svg>
<!-- Static inner ring for detail -->
<svg class="absolute w-2/3 h-2/3 fill-none opacity-20" viewBox="0 0 100 100">
<circle cx="50" cy="50" r="45" stroke="#f2be8c" stroke-width="1"></circle>
</svg>
</div>
<div class="space-y-2">
<h2 class="font-headline-md text-headline-md text-primary-fixed-dim">Building your plan...</h2>
<p class="font-body-md text-body-md text-on-surface-variant opacity-80">This usually takes a few seconds.</p>
</div>
</div>
<!-- Decorative Task Element (Post-it Style) -->
<div class="absolute bottom-32 right-8 hidden md:block transform rotate-2">
<div class="bg-surface-container-high p-4 rounded shadow-lg border-t-2 border-primary-container max-w-[200px]" style="opacity: 1; transform: translateY(0px) rotate(2deg); transition: 1s ease-out;">
<p class="font-note-sm text-note-sm text-on-surface-variant">Gathering sources for the thesis section...</p>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 bg-surface-container dark:bg-surface-container border-t border-outline-variant/10 shadow-lg flex justify-around items-center px-4 py-3 pb-safe">

<span class="font-label-caps text-label-caps mt-0.5">Home</span>
</a>

<span class="material-symbols-outlined">menu_book</span>
<span class="font-label-caps text-label-caps mt-0.5">Resources</span>
</a>

<script>
        // Micro-interaction for the "post-it" note appearance
        document.addEventListener('DOMContentLoaded', () => {
            const note = document.querySelector('.bg-surface-container-high');
            if (note) {
                note.style.opacity = '0';
                note.style.transform = 'translateY(20px) rotate(2deg)';
                setTimeout(() => {
                    note.style.transition = 'all 1s ease-out';
                    note.style.opacity = '1';
                    note.style.transform = 'translateY(0) rotate(2deg)';
                }, 800);
            }
        });
    </script>
