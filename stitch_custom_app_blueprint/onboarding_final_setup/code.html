<style>
        .ruled-bg {
            background-image: linear-gradient(to bottom, rgba(234, 225, 219, 0.05) 1px, transparent 1px);
            background-size: 100% 32px;
        }
        .contact-shadow {
            box-shadow: 0 40px 40px -15px rgba(0, 0, 0, 0.15), 0 8px 8px -4px rgba(0, 0, 0, 0.3);
        }
        .active-ochre-border {
            border: 2px solid #d4a373;
            background-color: rgba(212, 163, 115, 0.08);
        }
        .weak-chip-active {
            border: 2px solid #C1613F;
            background-color: rgba(193, 97, 63, 0.05);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col items-center">
<!-- Progress Bar -->
<div class="fixed top-0 left-0 w-full flex h-1.5 z-[100] gap-1 px-1 pt-1">
<div class="flex-1 bg-primary-container h-full rounded-full"></div>
<div class="flex-1 bg-primary-container h-full rounded-full"></div>
<div class="flex-1 bg-primary-container h-full rounded-full"></div>
<div class="flex-1 bg-primary-container h-full rounded-full"></div>
<div class="flex-1 bg-primary-container h-full rounded-full"></div>
</div>
<!-- Main Content Canvas -->
<main class="w-full max-w-xl px-container-padding pt-16 pb-32 flex-grow ruled-bg">
<!-- Header Section -->
<header class="mt-8 mb-12">
<h1 class="font-headline-md text-headline-md mb-2 text-on-surface">Last few things</h1>
<p class="font-body-md text-on-surface-variant italic">Both optional — skip if you're not sure yet.</p>
</header>
<!-- Questionnaire Sections -->
<div class="space-y-12">
<!-- Section 1: Subjects -->
<section aria-labelledby="struggling-subjects-heading">
<h2 class="font-body-md font-semibold text-on-surface-variant mb-6 uppercase tracking-wider text-sm" id="struggling-subjects-heading">Any subjects you're struggling with?</h2>
<div class="flex flex-wrap gap-3">
<!-- Physics Chip (Active/Weak) -->
<button class="weak-chip-active group flex items-center gap-3 px-5 py-4 rounded-xl transition-all active:scale-95 text-left contact-shadow">
<span class="material-symbols-outlined text-weak-area" style="font-variation-settings: 'FILL' 1;">devices_fold</span>
<span class="font-body-md font-semibold text-on-surface">Physics</span>
<div class="w-2 h-2 rounded-full bg-weak-area ml-2"></div>
</button>
<!-- Chemistry Chip (Inactive) -->
<button class="bg-surface-container hover:bg-surface-container-high flex items-center gap-3 px-5 py-4 rounded-xl border-2 border-transparent transition-all active:scale-95 text-left contact-shadow">
<span class="material-symbols-outlined text-on-surface-variant">key</span>
<span class="font-body-md font-semibold text-on-surface">Chemistry</span>
</button>
<!-- Mathematics Chip (Active/Weak) -->
<button class="weak-chip-active group flex items-center gap-3 px-5 py-4 rounded-xl transition-all active:scale-95 text-left contact-shadow">
<span class="material-symbols-outlined text-weak-area" style="font-variation-settings: 'FILL' 1;">functions</span>
<span class="font-body-md font-semibold text-on-surface">Mathematics</span>
<div class="w-2 h-2 rounded-full bg-weak-area ml-2"></div>
</button>
<!-- Biology Chip (Inactive) -->
<button class="bg-surface-container hover:bg-surface-container-high flex items-center gap-3 px-5 py-4 rounded-xl border-2 border-transparent transition-all active:scale-95 text-left contact-shadow">
<span class="material-symbols-outlined text-on-surface-variant">eyeglasses_2</span>
<span class="font-body-md font-semibold text-on-surface">Biology</span>
</button>
</div>
</section>
<!-- Section 2: Best Focus Time -->
<section aria-labelledby="focus-time-heading">
<h2 class="font-body-md font-semibold text-on-surface-variant mb-6 uppercase tracking-wider text-sm" id="focus-time-heading">When do you focus best?</h2>
<div class="grid grid-cols-3 gap-3">
<!-- Morning -->
<button class="bg-surface-container hover:bg-surface-container-high border-2 border-transparent flex flex-col items-center justify-center p-4 rounded-xl transition-all active:scale-95 contact-shadow">
<span class="material-symbols-outlined mb-2 text-on-surface-variant">light_mode</span>
<span class="font-label-caps text-label-caps text-on-surface">Morning</span>
</button>
<!-- Evening -->
<button class="bg-surface-container hover:bg-surface-container-high border-2 border-transparent flex flex-col items-center justify-center p-4 rounded-xl transition-all active:scale-95 contact-shadow">
<span class="material-symbols-outlined mb-2 text-on-surface-variant">wb_twilight</span>
<span class="font-label-caps text-label-caps text-on-surface">Evening</span>
</button>
<!-- Night (Active) -->
<button class="active-ochre-border flex flex-col items-center justify-center p-4 rounded-xl transition-all active:scale-95 contact-shadow">
<span class="material-symbols-outlined mb-2 text-primary" style="font-variation-settings: 'FILL' 1;">dark_mode</span>
<span class="font-label-caps text-label-caps text-primary">Night</span>
</button>
</div>
</section>
<!-- Tactile Note -->
<div class="mt-16 p-6 bg-surface-container-low rounded-xl border-t-4 border-primary contact-shadow rotate-[-0.5deg]">
<p class="font-note-sm text-note-sm text-on-surface-variant">
                    "I've always found that the quiet of the night helps me dive deeper into complex research topics without distraction."
                </p>
<p class="font-label-caps text-[10px] mt-2 text-primary opacity-60">— Sample Insight</p>
</div>
</div>
</main>
<!-- Fixed Bottom Navigation -->
<nav class="fixed bottom-0 left-0 w-full bg-surface-container h-24 flex items-center px-container-padding z-50">
<div class="max-w-xl mx-auto w-full flex items-center gap-4">
<!-- Back Button -->
<button class="h-14 px-6 border border-tertiary-container text-tertiary-container rounded-xl font-label-caps text-label-caps flex items-center justify-center hover:bg-tertiary-container/10 transition-colors">
                Back
            </button>
<!-- Generate Button -->
<button class="h-14 flex-grow bg-primary-container text-on-primary-container rounded-xl font-label-caps text-label-caps font-bold flex items-center justify-center gap-2 hover:opacity-90 active:scale-[0.98] transition-all shadow-lg">
<span class="material-symbols-outlined text-[20px]">auto_fix</span>
                Generate my plan
            </button>
</div>
</nav>
<!-- Subtle Background Shader for Depth -->
<div class="fixed inset-0 -z-10 pointer-events-none opacity-20">

</div>
<script>
        // Simple micro-interaction for selection logic
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function() {
                if(this.classList.contains('flex-col')) {
                    // Focus pills single select
                    const siblings = this.parentElement.querySelectorAll('button');
                    siblings.forEach(s => {
                        s.classList.remove('active-ochre-border');
                        s.classList.add('bg-surface-container', 'border-transparent');
                        const icon = s.querySelector('.material-symbols-outlined');
                        const label = s.querySelector('.font-label-caps');
                        if (icon) {
                            icon.classList.replace('text-primary', 'text-on-surface-variant');
                            icon.style.fontVariationSettings = "'FILL' 0";
                        }
                        if (label) label.classList.replace('text-primary', 'text-on-surface');
                    });
                    this.classList.add('active-ochre-border');
                    this.classList.remove('bg-surface-container', 'border-transparent');
                    const activeIcon = this.querySelector('.material-symbols-outlined');
                    const activeLabel = this.querySelector('.font-label-caps');
                    if (activeIcon) {
                        activeIcon.classList.replace('text-on-surface-variant', 'text-primary');
                        activeIcon.style.fontVariationSettings = "'FILL' 1";
                    }
                    if (activeLabel) activeLabel.classList.replace('text-on-surface', 'text-primary');
                } else if (this.classList.contains('gap-3') && !this.closest('nav')) {
                    // Subject chips multi-select toggle
                    this.classList.toggle('weak-chip-active');
                    this.classList.toggle('bg-surface-container');
                    this.classList.toggle('border-transparent');
                    
                    const icon = this.querySelector('.material-symbols-outlined');
                    const dot = this.querySelector('.w-2');
                    
                    if(this.classList.contains('weak-chip-active')) {
                        icon.classList.add('text-weak-area');
                        icon.style.fontVariationSettings = "'FILL' 1";
                        if(!dot) {
                            const newDot = document.createElement('div');
                            newDot.className = "w-2 h-2 rounded-full bg-weak-area ml-2";
                            this.appendChild(newDot);
                        }
                    } else {
                        icon.classList.remove('text-weak-area');
                        icon.style.fontVariationSettings = "'FILL' 0";
                        if(dot) dot.remove();
                    }
                }
            });
        });
    </script>
</body></html>
