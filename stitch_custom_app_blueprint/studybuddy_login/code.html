<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-between notebook-bg px-container-padding py-24 selection:bg-primary-container selection:text-on-primary-container">
<!-- Header Section -->
<header class="w-full max-w-md text-center flex flex-col items-center gap-4">
<div class="mb-2">
<!-- Subtle Branding Icon -->
<span class="material-symbols-outlined text-primary text-4xl mb-4">school</span>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight">StudyBuddy</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Your AI study planner</p>
</div>
</header>
<!-- Main Form Section -->
<main class="w-full max-w-md flex flex-col items-center gap-12 z-10">
<div class="w-full group">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase block mb-4" for="name-input">
                Your name
            </label>
<input autofocus="" class="underlined-input w-full bg-transparent border-0 border-b-2 border-outline py-4 font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant focus:ring-0" id="name-input" placeholder="Enter your name to begin..." type="text"/>
</div>
<!-- Decorative scholarly quote -->
<div class="mt-8 text-center opacity-40">
<p class="font-note-sm text-note-sm italic text-on-surface">
                "An investment in knowledge always pays the best interest."
            </p>
</div>
</main>
<!-- Footer Action -->
<footer class="w-full max-w-md">
<button class="w-full bg-primary text-on-primary py-4 rounded-lg font-label-caps text-label-caps tracking-widest uppercase shadow-[0_4px_8px_rgba(0,0,0,0.3),0_24px_40px_rgba(0,0,0,0.15)] active:scale-95 transition-all duration-200" onclick="handleLogin()" type="submit">
            Continue
        </button>
<div class="mt-8 flex justify-center items-center gap-6">
<span class="h-[1px] w-12 bg-outline-variant"></span>
<span class="font-label-caps text-[10px] text-outline uppercase tracking-[0.2em]">Academic Focus</span>
<span class="h-[1px] w-12 bg-outline-variant"></span>
</div>
</footer>
<!-- Subtle Background Detail -->
<div class="fixed bottom-12 right-12 pointer-events-none opacity-10 hidden lg:block">
<span class="material-symbols-outlined text-[120px]" style="font-variation-settings: 'wght' 100;">menu_book</span>
</div>
<script>
        // Simple Micro-interaction for the login flow
        function handleLogin() {
            const input = document.getElementById('name-input');
            const button = document.querySelector('button');
            
            if (input.value.trim() !== "") {
                button.innerHTML = "Opening Library...";
                button.classList.add('opacity-80', 'scale-95');
                
                // Simulate a transition to the main app
                setTimeout(() => {
                    console.log('Redirecting Alex Scholar to the curriculum...');
                    // In a real app, this would route to the dashboard
                }, 800);
            } else {
                input.classList.remove('border-outline');
                input.classList.add('border-error');
                setTimeout(() => {
                    input.classList.remove('border-error');
                    input.classList.add('border-outline');
                }, 1000);
            }
        }

        // Allow 'Enter' key to trigger continue
        document.getElementById('name-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                handleLogin();
            }
        });
    </script>
