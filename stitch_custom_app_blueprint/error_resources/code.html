<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>StudyBuddy - Resources Failed</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400..900;1,400..900&amp;family=Source+Sans+3:ital,wght@0,200..900;1,200..900&amp;family=Caveat:wght@400..700&amp;display=swap" rel="stylesheet"/>

<style>
        body {
            background-color: #17130f; /* surface-dim */
            color: #eae1db; /* on-surface */
            font-family: 'Source Sans 3', sans-serif;
            overflow-x: hidden;
        }
        
        .ruled-bg {
            background-image: linear-gradient(to bottom, rgba(234, 225, 219, 0.05) 1px, transparent 1px);
            background-size: 100% 32px; /* spacing.notebook-line-height */
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .active-chip {
            background-color: #f2be8c; /* primary */
            color: #482904; /* on-primary */
        }

        .dual-shadow {
            box-shadow: 
                0 24px 40px rgba(0, 0, 0, 0.15), /* Ambient Shadow */
                0 6px 8px rgba(0, 0, 0, 0.3);    /* Contact Shadow */
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#d8e7cc",
                        "on-background": "#eae1db",
                        "surface-container-low": "#1f1b17",
                        "error": "#ffb4ab",

                        "tertiary": "#b0ccdb",
                        "error-container": "#93000a",
                        "secondary-container": "#3d4b37",
                        "on-error-container": "#ffdad6",
                        "tertiary-container": "#95b1bf",
                        "surface-tint": "#f0bd8b",
                        "on-surface": "#eae1db",
                        "on-secondary-container": "#aabaa0",
                        "on-error": "#690005",
                        "on-tertiary-container": "#294450",

                        "surface": "#17130f",
                        "secondary": "#bccbb1",
                        "on-secondary-fixed": "#121f0e",
                        "on-surface-variant": "#d4c4b7",
                        "tertiary-fixed-dim": "#aecbda",
                        "surface-dim": "#17130f",
                        "primary-fixed": "#ffdcbd",
                        "tertiary-fixed": "#cae7f6",
                        "surface-container-highest": "#393430",
                        "surface-container-high": "#2e2925",
                        "on-tertiary": "#18343f",
                        "inverse-primary": "#7d562d",
                        "on-tertiary-fixed": "#001f2a",
                        "primary": "#f2be8c"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "notebook-line-height": "32px",
                        "gutter": "16px",
                        "base": "8px",
                        "container-padding": "24px"
                    },
                    "fontFamily": {
                        "label-caps": ["Source Sans 3"],
                        "note-sm": ["Caveat"],
                        "body-lg": ["Source Sans 3"],
                        "display-lg": ["Literata"],

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background min-h-screen flex flex-col">
<!-- Top App Bar -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-gutter h-16 bg-background">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary">menu</span>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary">StudyBuddy</h1>
</div>
<div class="flex items-center">
<span class="material-symbols-outlined text-primary">search</span>
</div>
</header>
<!-- Content Area -->
<main class="flex-grow pt-16 pb-20 px-gutter relative ruled-bg">
<!-- Filter Chip Row -->
<div class="flex gap-2 overflow-x-auto py-4 no-scrollbar">
<button class="active-chip px-4 py-1.5 rounded-full font-label-caps text-label-caps whitespace-nowrap">All</button>
<button class="bg-surface-container-high text-on-surface-variant px-4 py-1.5 rounded-full font-label-caps text-label-caps whitespace-nowrap hover:bg-surface-container transition-colors">Physics</button>
<button class="bg-surface-container-high text-on-surface-variant px-4 py-1.5 rounded-full font-label-caps text-label-caps whitespace-nowrap hover:bg-surface-container transition-colors">Chemistry</button>
<button class="bg-surface-container-high text-on-surface-variant px-4 py-1.5 rounded-full font-label-caps text-label-caps whitespace-nowrap hover:bg-surface-container transition-colors">Mathematics</button>
<button class="bg-surface-container-high text-on-surface-variant px-4 py-1.5 rounded-full font-label-caps text-label-caps whitespace-nowrap hover:bg-surface-container transition-colors">Biology</button>
</div>
<!-- Error State Container -->
<div class="flex flex-col items-center justify-center min-h-[530px]">
<!-- Error Card -->
<div class="w-full max-w-sm bg-surface-container rounded-xl p-8 flex flex-col items-center text-center dual-shadow relative overflow-hidden">
<!-- Top Notch for "Tactile" look -->
<div class="absolute top-0 left-0 w-full h-1 bg-error-container"></div>
<div class="mb-6 p-4 rounded-full bg-error-container/20">
<span class="material-symbols-outlined text-[48px] text-error" style="font-variation-settings: 'wght' 300;">error_outline</span>
</div>
<h2 class="font-headline-md text-headline-md-mobile text-on-surface mb-3">Couldn't load resources</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-8 px-2">
                    Your saved resources are safe — just couldn't fetch new ones right now. Check your connection.
                </p>
<button class="w-full bg-primary text-on-primary py-4 rounded-lg font-label-caps text-label-caps uppercase tracking-widest active:scale-95 transition-transform duration-150" onclick="location.reload()">
                    Retry
                </button>
<!-- Secondary Action -->
<button class="mt-4 text-on-surface-variant font-label-caps text-label-caps underline underline-offset-4 decoration-outline-variant">
                    Go to Offline Library
                </button>
</div>
<!-- Tactile "Post-it" Note Style Hint -->
<div class="mt-12 -rotate-2 bg-surface-container-high p-4 rounded-lg dual-shadow max-w-[200px] border-t-4 border-primary">
<p class="font-note-sm text-note-sm text-primary">
                    Pro tip: Try refreshing the app if this persists.
                </p>
</div>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center bg-surface-container-low py-3 px-gutter border-t border-outline-variant/20 shadow-[0_-4px_24px_rgba(0,0,0,0.15)] rounded-t-xl">
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1.5 hover:text-on-surface transition-colors active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined mb-1">home</span>
<span class="font-label-caps text-label-caps">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-5 py-1.5 hover:text-on-surface transition-colors active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined mb-1">school</span>
<span class="font-label-caps text-label-caps">Tutor</span>
</a>
<a class="flex flex-col items-center justify-center text-primary px-5 py-1.5 active:scale-90 transition-transform duration-200" href="#">
<!-- Resources Active: Ochre text/icon, no pill background as requested -->
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">menu_book</span>
<span class="font-label-caps text-label-caps font-bold">Resources</span>
</a>
</nav>
<script>
        // Simple Micro-interaction for buttons
        document.querySelectorAll('button, a').forEach(el => {
            el.addEventListener('mousedown', () => {
                el.classList.add('scale-95');
            });
            el.addEventListener('mouseup', () => {
                el.classList.remove('scale-95');
            });
            el.addEventListener('mouseleave', () => {
                el.classList.remove('scale-95');
            });
        });
    </script>
</body></html>
