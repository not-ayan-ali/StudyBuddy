<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>StudyBuddy Onboarding - Step 1</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,600;0,700;1,400&amp;family=Source+Sans+3:wght@400;600&amp;family=Caveat&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary": "#18343f",
                    "on-primary-container": "#5b3912",
                    "inverse-on-surface": "#342f2c",
                    "surface-container-lowest": "#110d0a",
                    "primary": "#f2be8c",
                    "surface-variant": "#393430",
                    "on-primary-fixed-variant": "#623f18",
                    "on-error-container": "#ffdad6",
                    "surface-container": "#231f1b",
                    "tertiary-container": "#95b1bf",
                    "secondary-fixed": "#d8e7cc",
                    "on-secondary-container": "#aabaa0",
                    "surface-dim": "#17130f",
                    "on-secondary": "#273422",
                    "inverse-primary": "#7d562d",
                    "tertiary-fixed": "#cae7f6",
                    "surface-tint": "#f0bd8b",
                    "surface-container-highest": "#393430",
                    "on-secondary-fixed": "#121f0e",
                    "error": "#ffb4ab",
                    "surface-container-low": "#1f1b17",
                    "primary-container": "#d4a373",
                    "on-background": "#eae1db",
                    "on-surface": "#eae1db",
                    "primary-fixed-dim": "#f0bd8b",
                    "tertiary": "#b0ccdb",
                    "error-container": "#93000a",
                    "on-primary-fixed": "#2c1600",
                    "surface": "#17130f",
                    "on-tertiary-container": "#294450",
                    "on-surface-variant": "#d4c4b7",
                    "background": "#17130f",
                    "secondary-fixed-dim": "#bccbb1",
                    "primary-fixed": "#ffdcbd",
                    "secondary": "#bccbb1",
                    "on-error": "#690005",
                    "secondary-container": "#3d4b37",
                    "surface-bright": "#3d3834",
                    "inverse-surface": "#eae1db",
                    "outline-variant": "#50453b",
                    "tertiary-fixed-dim": "#aecbda",
                    "outline": "#9c8e82",
                    "on-secondary-fixed-variant": "#3d4b37",
                    "on-primary": "#482904",
                    "on-tertiary-fixed-variant": "#2f4a57",
                    "on-tertiary-fixed": "#001f2a",
                    "surface-container-high": "#2e2925"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "base": "8px",
                    "gutter": "16px",
                    "container-padding": "24px",
                    "notebook-line-height": "32px"
            },
            "fontFamily": {
                    "note-sm": ["Caveat"],
                    "body-lg": ["\"Source Sans 3\""],
                    "headline-md": ["Literata"],
                    "display-lg": ["Literata"],
                    "display-lg-mobile": ["Literata"],
                    "label-caps": ["\"Source Sans 3\""],
                    "body-md": ["\"Source Sans 3\""]
            },
            "fontSize": {
                    "note-sm": ["20px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "display-lg-mobile": ["34px", {"lineHeight": "40px", "fontWeight": "700"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #17130f;
            color: #eae1db;
            /* Rule texture overlay */
            background-image: linear-gradient(rgba(234, 225, 219, 0.05) 1px, transparent 1px);
            background-size: 100% 32px;
        }

        .ambient-shadow {
            box-shadow: 0 24px 40px rgba(0, 0, 0, 0.15);
        }

        .contact-shadow {
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        /* Custom appearance for time picker to match underlined style */
        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(80%) sepia(20%) saturate(200%) hue-rotate(350deg);
            cursor: pointer;
            opacity: 0.7;
        }
        
        .focus-underline:focus-within {
            border-color: #d4a373;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col items-center justify-center p-container-padding font-body-md text-body-md overflow-x-hidden">
<!-- Onboarding Container -->
<main class="w-full max-w-[480px] flex flex-col gap-10">
<!-- Top: Progress Bar -->
<div class="w-full flex gap-2 h-1.5">
<div class="flex-1 bg-primary-container rounded-full"></div>
<div class="flex-1 bg-surface-container-high rounded-full"></div>
<div class="flex-1 bg-surface-container-high rounded-full"></div>
<div class="flex-1 bg-surface-container-high rounded-full"></div>
<div class="flex-1 bg-surface-container-high rounded-full"></div>
</div>
<!-- Heading & Guidance -->
<div class="flex flex-col gap-3">
<h1 class="font-headline-md text-headline-md text-on-surface">When are you in class?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                We'll build your study plan around your fixed school hours.
            </p>
</div>
<!-- Body: Form Section -->
<div class="flex flex-col gap-8 bg-surface p-8 lg:p-10 rounded-lg ambient-shadow contact-shadow border border-outline-variant/10">
<div class="space-y-12">
<!-- Time Picker 1 -->
<div class="group relative flex flex-col gap-2 focus-underline border-b border-outline-variant transition-colors duration-300">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">School starts</label>
<div class="flex items-center gap-3 py-2">
<span class="material-symbols-outlined text-on-surface-variant select-none" data-icon="schedule">schedule</span>
<input class="bg-transparent border-none focus:ring-0 w-full font-body-lg text-body-lg text-on-surface p-0 m-0 outline-none" type="time" value="08:00"/>
</div>
</div>
<!-- Time Picker 2 -->
<div class="group relative flex flex-col gap-2 focus-underline border-b border-outline-variant transition-colors duration-300">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">School ends</label>
<div class="flex items-center gap-3 py-2">
<span class="material-symbols-outlined text-on-surface-variant select-none" data-icon="history">history</span>
<input class="bg-transparent border-none focus:ring-0 w-full font-body-lg text-body-lg text-on-surface p-0 m-0 outline-none" type="time" value="15:30"/>
</div>
</div>
</div>
<!-- Post-it/Personal Reflection Note (Subtle Brand Identity) -->
<div class="mt-4 p-4 bg-surface-container rounded-lg border-t-2 border-primary-container transform -rotate-1 shadow-sm">
<p class="font-note-sm text-note-sm text-on-surface-variant italic">
                    Don't worry about lunch breaks or commuting yet, we'll refine those details in the next steps.
                </p>
</div>
</div>
<!-- Bottom: Button Row (40/60 Split) -->
<div class="flex gap-4 w-full items-center">
<!-- Back Button -->
<button class="flex-[4] h-12 border border-tertiary text-tertiary font-label-caps text-label-caps uppercase tracking-widest rounded-[4px] hover:bg-tertiary/10 transition-all active:scale-[0.98]">
                Back
            </button>
<!-- Next Button -->
<button class="flex-[6] h-12 bg-primary-container text-on-primary-container font-label-caps text-label-caps font-bold uppercase tracking-widest rounded-[4px] hover:brightness-110 shadow-sm transition-all active:scale-[0.98]">
                Next
            </button>
</div>
</main>
<!-- Visual Embellishment: Decorative Anchor -->
<div class="fixed bottom-10 right-10 opacity-10 pointer-events-none select-none hidden lg:block">
<span class="material-symbols-outlined text-[120px]" data-icon="auto_stories">auto_stories</span>
</div>
<script>
        // Simple Micro-interaction for inputs
        const inputs = document.querySelectorAll('input[type="time"]');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('border-primary-container');
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.classList.remove('border-primary-container');
            });
        });

        // Interactive "Next" logic placeholder
        const nextBtn = document.querySelector('button.bg-primary-container');
        nextBtn.addEventListener('click', () => {
            nextBtn.classList.add('scale-95');
            setTimeout(() => {
                nextBtn.classList.remove('scale-95');
                // Potential navigation logic here
            }, 150);
        });
    </script>
</body></html>
