<!-- Subtle Atmospheric Interaction -->
<script>
    document.addEventListener('mousemove', (e) => {
      const x = e.clientX / window.innerWidth;
      const y = e.clientY / window.innerHeight;
      
      // Extremely subtle shift for the "paper stack" depth effect
      const iconContainer = document.querySelector('.relative.bg-surface-container');
      if(iconContainer) {
        const moveX = (x - 0.5) * 8;
        const moveY = (y - 0.5) * 8;
        iconContainer.style.transform = `translate(${moveX}px, ${moveY}px)`;
      }
    });

    // Horizontal scroll for chips
    const scrollContainer = document.querySelector('.no-scrollbar');
    if(scrollContainer) {
      scrollContainer.addEventListener('wheel', (evt) => {
        evt.preventDefault();
        scrollContainer.scrollLeft += evt.deltaY;
      });
    }
  </script>
